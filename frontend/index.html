
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GIDEON</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@300;600;900&display=swap');
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 44%,
    #e8f4ff 0%, #c8dff5 30%, #aacae8 60%, #8fb8d8 100%);
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
#gideon-label {
  position: fixed; bottom: 52px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Orbitron', 'Courier New', monospace;
  font-size: clamp(30px, 4.5vw, 54px); font-weight: 600;
  letter-spacing: clamp(12px, 2.5vw, 24px);
  color: rgba(40, 95, 170, 0.62);
  pointer-events: none; white-space: nowrap;
  text-shadow: 0 0 40px rgba(80,160,255,0.20), 0 2px 8px rgba(20,60,140,0.12);
  animation: breathe 4s ease-in-out infinite alternate;
  transition: opacity 0.8s ease;
}
@keyframes breathe {
  from { opacity:.44; letter-spacing:clamp(11px,2.3vw,22px); }
  to   { opacity:.68; letter-spacing:clamp(13px,2.7vw,26px); }
}
#sub {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 5px;
  color: rgba(50,110,190,0.32); pointer-events: none;
  white-space: nowrap; text-transform: uppercase; transition: opacity 0.4s ease;
}
#dev-controls {
  position: fixed; top: 18px; right: 18px; display: flex; gap: 8px; z-index: 100;
}
#dev-controls button {
  font-family: 'Courier New', monospace; font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase;
  padding: 6px 12px; border-radius: 2px; cursor: pointer;
  background: rgba(200,220,245,0.80); border: 1px solid rgba(60,120,210,0.30);
  color: rgba(40,90,170,0.80); transition: all 0.2s;
}
#dev-controls button:hover  { background: rgba(180,210,240,0.90); border-color: rgba(60,140,220,0.55); }
#dev-controls button.active { background: rgba(80,140,220,0.85); border-color: rgba(60,140,220,0.80); color:#fff; }
#btn-anim-test { border-color:rgba(80,160,255,0.50)!important; color:rgba(40,100,200,0.90)!important; }

/* ── COMMAND PANEL ───────────────────────────────────────────────────── */
#command-panel {
  position: fixed;
  bottom: 100px; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
#command-panel.visible {
  opacity: 1;
  pointer-events: auto;
}
#cmd-input {
  font-family: 'Courier New', monospace; font-size: 12px;
  letter-spacing: 2px; text-transform: uppercase;
  width: clamp(220px, 36vw, 460px);
  padding: 9px 16px;
  background: rgba(200,225,250,0.70);
  border: 1px solid rgba(60,120,210,0.35);
  border-radius: 2px;
  color: rgba(30,70,160,0.90);
  outline: none;
  transition: background 0.2s, border-color 0.2s;
}
#cmd-input::placeholder { color: rgba(80,130,200,0.45); }
#cmd-input:focus {
  background: rgba(210,232,255,0.88);
  border-color: rgba(60,140,220,0.65);
}
#cmd-send {
  font-family: 'Courier New', monospace; font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase;
  padding: 9px 14px;
  background: rgba(80,140,220,0.80); border: 1px solid rgba(60,140,220,0.80);
  border-radius: 2px; color: #fff; cursor: pointer;
  transition: background 0.2s;
}
#cmd-send:hover { background: rgba(60,120,200,0.95); }

/* ── MIC BUTTON ──────────────────────────────────────────────────────── */
#mic-btn {
  position: fixed;
  bottom: 100px; right: 34px;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(200,225,250,0.78);
  border: 1.5px solid rgba(60,120,210,0.38);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
#mic-btn:hover { background: rgba(180,215,245,0.92); border-color: rgba(60,140,225,0.60); }
#mic-btn.listening {
  background: rgba(80,140,220,0.85);
  border-color: rgba(60,140,220,0.90);
  box-shadow: 0 0 0 0 rgba(80,160,255,0.55);
  animation: mic-pulse 1.1s ease-in-out infinite;
}
@keyframes mic-pulse {
  0%   { box-shadow: 0 0 0 0   rgba(80,160,255,0.55); }
  70%  { box-shadow: 0 0 0 14px rgba(80,160,255,0.00); }
  100% { box-shadow: 0 0 0 0   rgba(80,160,255,0.00); }
}
#mic-icon { pointer-events: none; }

/* ── RESPONSE PANEL ──────────────────────────────────────────────────── */
#response-panel {
  position: fixed;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  max-width: clamp(260px, 55vw, 680px);
  font-family: 'Courier New', monospace; font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(40,90,170,0.78);
  background: rgba(200,225,250,0.72);
  border: 1px solid rgba(60,120,210,0.28);
  border-radius: 2px;
  padding: 7px 18px;
  text-align: center;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#response-panel.visible { opacity: 1; }
#response-panel.error   { color: rgba(180,50,50,0.82); border-color: rgba(200,80,80,0.30); }

/* ── TOGGLE CMD BUTTON ───────────────────────────────────────────────── */
#btn-cmd-toggle {
  border-color: rgba(80,140,220,0.45)!important;
  color: rgba(40,100,195,0.85)!important;
}
#btn-cmd-toggle.active {
  background: rgba(80,140,220,0.85)!important;
  color: #fff!important;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gideon-label">GIDEON</div>
<div id="sub">NEURAL CORE ACTIVE</div>
<div id="dev-controls">
  <button onclick="setState('idle')"    id="btn-idle">IDLE</button>
  <button onclick="setState('think')"   id="btn-think">THINK</button>
  <button onclick="setState('listen')"  id="btn-listen">LISTEN</button>
  <button onclick="setState('speak')"   id="btn-speak">SPEAK</button>
  <button onclick="runAnimationTest()"  id="btn-anim-test">ANIMATION TEST</button>
  <button onclick="gideonDismiss()"     id="btn-dismiss" style="border-color:rgba(200,80,80,0.45)!important;color:rgba(180,60,60,0.9)!important;">DISMISS</button>
  <button onclick="gideonSummon()"      id="btn-summon"  style="border-color:rgba(60,180,100,0.45)!important;color:rgba(40,160,80,0.9)!important;">SUMMON</button>
  <button onclick="toggleCommandPanel()" id="btn-cmd-toggle">CMD</button>
</div>

<!-- ── Command input panel ─────────────────────────────────── -->
<div id="command-panel">
  <input id="cmd-input" type="text" placeholder="введите команду..." autocomplete="off" />
  <button id="cmd-send" onclick="sendTextCommand()">SEND</button>
</div>

<!-- ── Mic button ─────────────────────────────────────────── -->
<button id="mic-btn" title="Голосовая команда" onclick="sendVoiceCommand()">
  <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"
       stroke="rgba(40,90,170,0.80)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="11" rx="3"/>
    <path d="M5 10a7 7 0 0 0 14 0"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="8"  y1="22" x2="16" y2="22"/>
  </svg>
</button>

<!-- ── Response / status panel ───────────────────────────── -->
<div id="response-panel"></div>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════════════
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const subEl   = document.getElementById('sub');
const labelEl = document.getElementById('gideon-label');

let W, H, CX, CY, R;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2; CY = H / 2 - 30;
  R  = Math.min(W, H) * 0.212;
  buildParticles();
  if (speakCorner && speakCorner.phase !== 'idle') {
    speakCorner.cornerR = Math.min(W,H) * 0.060;
    speakCorner.cornerX = W - speakCorner.cornerR - 28;
    speakCorner.cornerY = H - speakCorner.cornerR - 28;
  }
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════
//  LOD — система качества
//  Управляет: кол-вом частиц, шагом wireframe, эффектами
//  idle=low, think=mid, speak/listen=high
// ═══════════════════════════════════════════════════════════════
const LOD = {
  // Конфигурации уровней
  levels: {
    low:  { partStep: 3, wireStep: 2, glowPasses: 1, dotGradient: false },
    mid:  { partStep: 2, wireStep: 1, glowPasses: 1, dotGradient: false },
    high: { partStep: 1, wireStep: 1, glowPasses: 2, dotGradient: true  },
  },
  current: 'low',

  update(state) {
    if      (state === 'idle')              this.current = 'low';
    else if (state === 'think')             this.current = 'mid';
    else /* speak / listen */               this.current = 'high';
  },

  get cfg() { return this.levels[this.current]; },
};

// ═══════════════════════════════════════════════════════════════
//  STATE MACHINE
// ═══════════════════════════════════════════════════════════════
const STATE_LABELS = {
  idle:'NEURAL CORE ACTIVE', listen:'LISTENING...', speak:'SPEAKING...', think:'PROCESSING...',
};
const STATE_PARAMS = {
  idle:  { wireAlpha:1.00, partAlpha:0.00, energy:0.30, spd:0.22, siriAmp:0.012, siriFreq:1.0 },
  think: { wireAlpha:0.00, partAlpha:0.70, energy:0.48, spd:0.38, siriAmp:0.018, siriFreq:1.2 },
  listen:{ wireAlpha:0.00, partAlpha:0.95, energy:0.72, spd:0.70, siriAmp:0.040, siriFreq:1.8 },
  speak: { wireAlpha:0.00, partAlpha:1.00, energy:0.85, spd:0.55, siriAmp:0.022, siriFreq:1.4 },
};

// ── SPEAK CORNER ─────────────────────────────────────────────
const speakCorner = {
  phase:'idle', phaseTime:0,
  drawCX:0, drawCY:0, cornerX:0, cornerY:0, cornerR:0, sceneScale:1.0,
};
let _firstSpeak = true;

function enterSpeakCorner() {
  if (_firstSpeak) { _firstSpeak = false; speakCorner.phase = 'idle'; return; }
  speakCorner.cornerR    = Math.min(W,H) * 0.060;
  speakCorner.cornerX    = W - speakCorner.cornerR - 28;
  speakCorner.cornerY    = H - speakCorner.cornerR - 28;
  speakCorner.drawCX     = CX; speakCorner.drawCY = CY;
  speakCorner.sceneScale = 1.0;
  speakCorner.phase      = 'goCorner'; speakCorner.phaseTime = 0;
  labelEl.style.transition = 'opacity 0.5s ease'; labelEl.style.opacity = '0';
  subEl.style.transition   = 'opacity 0.5s ease'; subEl.style.opacity   = '0';
}
function exitSpeakCorner() {
  if (speakCorner.phase === 'inCorner' || speakCorner.phase === 'goCorner') {
    speakCorner.phase = 'return'; speakCorner.phaseTime = 0;
  }
}
function updateSpeakCorner(dt) {
  if (speakCorner.phase === 'idle') return;
  speakCorner.phaseTime += dt;
  const pt = speakCorner.phaseTime;
  if (speakCorner.phase === 'goCorner') {
    const p = Math.min(1, pt / 1.0), ep = easeOut3(p);
    speakCorner.drawCX    = lerp(CX, speakCorner.cornerX, ep);
    speakCorner.drawCY    = lerp(CY, speakCorner.cornerY, ep);
    speakCorner.sceneScale= lerp(1.0, speakCorner.cornerR / R, ep);
    if (p >= 1.0) { speakCorner.phase = 'inCorner'; speakCorner.phaseTime = 0; }
  } else if (speakCorner.phase === 'inCorner') {
    const cr = speakCorner.cornerR;
    speakCorner.drawCX    = speakCorner.cornerX + Math.sin(pt*1.1)*cr*0.06;
    speakCorner.drawCY    = speakCorner.cornerY + Math.sin(pt*0.75+0.8)*cr*0.05;
    speakCorner.sceneScale= speakCorner.cornerR/R*(1.0+Math.sin(pt*0.9)*0.03);
  } else if (speakCorner.phase === 'return') {
    speakCorner.drawCX    = lerp(speakCorner.drawCX, CX,  0.07);
    speakCorner.drawCY    = lerp(speakCorner.drawCY, CY,  0.07);
    speakCorner.sceneScale= lerp(speakCorner.sceneScale, 1.0, 0.07);
    if (Math.abs(speakCorner.drawCX-CX) < 2 && speakCorner.sceneScale > 0.98) {
      speakCorner.phase = 'idle'; speakCorner.sceneScale = 1.0;
      speakCorner.drawCX = CX; speakCorner.drawCY = CY;
      labelEl.style.opacity = ''; subEl.style.opacity = '';
    }
  }
}
function isSpeakCornerActive() {
  return speakCorner.phase==='goCorner'||speakCorner.phase==='inCorner'||speakCorner.phase==='return';
}

let gState = 'idle';
let cur = { ...STATE_PARAMS.idle };
Object.defineProperty(cur,'transitionProgress',{ get(){ return this.partAlpha; } });

const lerp     = (a,b,t) => a+(b-a)*t;
const LERP_SPD = 0.035;

function lerpState() {
  const tgt = STATE_PARAMS[gState] || STATE_PARAMS.idle;
  for (const k in tgt) cur[k] = lerp(cur[k], tgt[k], LERP_SPD);
}

function setState(state) {
  if (!STATE_PARAMS[state]) return;
  const prev = gState;
  gState = state;
  subEl.textContent = STATE_LABELS[state] || '';
  LOD.update(state);
  if (state==='think' && prev!=='think') enterThink();
  if (state!=='think' && prev==='think') exitThink();
  if (state==='speak' && prev!=='speak') enterSpeakCorner();
  if (state!=='speak' && prev==='speak') exitSpeakCorner();
  document.querySelectorAll('#dev-controls button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('btn-'+state);
  if (btn) btn.classList.add('active');
}
setState('idle');

// ═══════════════════════════════════════════════════════════════
//  WEBSOCKET  (расширенный: text_command + voice_command)
// ═══════════════════════════════════════════════════════════════
let _ws = null;

(function connectWS(){
  try {
    const s = new WebSocket('ws://localhost:8765');
    _ws = s;
    s.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        if (m.state) setState(m.state);
        if (typeof m.amplitude === 'number') setListenAmplitude(m.amplitude);
        // Показать распознанный текст
        if (m.recognized) showResponse('RECOGNIZED: ' + m.recognized, false);
        // Показать ответ на команду
        if (m.response)   showResponse(m.response, m.status === 'error');
      } catch(_){}
    };
    s.onclose = ()=>{ _ws=null; setTimeout(connectWS,3000); };
    s.onerror = ()=>s.close();
  } catch(_){ setTimeout(connectWS,3000); }
})();

/** Отправить текстовую команду через WebSocket. */
function sendTextCommand() {
  const input = document.getElementById('cmd-input');
  const cmd   = input.value.trim();
  if (!cmd) return;
  if (_ws && _ws.readyState === WebSocket.OPEN) {
    _ws.send(JSON.stringify({ type: 'text_command', command: cmd }));
  }
  input.value = '';
}

/** Отправить запрос на голосовую команду. */
function sendVoiceCommand() {
  if (!_ws || _ws.readyState !== WebSocket.OPEN) return;
  _ws.send(JSON.stringify({ type: 'voice_command' }));
  setMicListening(true);
}

// ─── Command panel toggle ──────────────────────────────────────
let _cmdPanelVisible = false;
function toggleCommandPanel() {
  _cmdPanelVisible = !_cmdPanelVisible;
  const panel = document.getElementById('command-panel');
  const btn   = document.getElementById('btn-cmd-toggle');
  panel.classList.toggle('visible', _cmdPanelVisible);
  btn.classList.toggle('active',    _cmdPanelVisible);
  if (_cmdPanelVisible) document.getElementById('cmd-input').focus();
}

// Enter в поле ввода → отправить
document.getElementById('cmd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendTextCommand();
});

// ─── Mic button state ─────────────────────────────────────────
let _micListeningTimer = null;
function setMicListening(on) {
  const btn = document.getElementById('mic-btn');
  btn.classList.toggle('listening', on);
  const stroke = on ? 'rgba(255,255,255,0.90)' : 'rgba(40,90,170,0.80)';
  btn.querySelector('svg').setAttribute('stroke', stroke);
  if (on) {
    clearTimeout(_micListeningTimer);
    // Автосброс через 8 сек (если backend не ответил)
    _micListeningTimer = setTimeout(() => setMicListening(false), 8000);
  }
}

// Сбросить подсветку микрофона при переходе в не-listen state
const _origSetState = setState;
// Перехватываем setState — сбрасываем mic при выходе из listen
const _setStateOrig = setState;
setState = function(state) {
  if (state !== 'listen') setMicListening(false);
  _setStateOrig(state);
};

// ─── Response panel ───────────────────────────────────────────
let _responseTimer = null;
function showResponse(text, isError) {
  const panel = document.getElementById('response-panel');
  panel.textContent = text;
  panel.classList.toggle('error', !!isError);
  panel.classList.add('visible');
  clearTimeout(_responseTimer);
  _responseTimer = setTimeout(() => {
    panel.classList.remove('visible');
  }, 4000);
}

// ═══════════════════════════════════════════════════════════════
//  MOUSE
// ═══════════════════════════════════════════════════════════════
let mx=0, my=0, rotY=0, rotX=0;
window.addEventListener('mousemove', e=>{
  mx=(e.clientX/W-0.5)*2; my=(e.clientY/H-0.5)*2;
});

// ═══════════════════════════════════════════════════════════════
//  EASING
// ═══════════════════════════════════════════════════════════════
const easeInOut = x => x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const easeOut3  = x => 1-Math.pow(1-x,3);

// ═══════════════════════════════════════════════════════════════
//  DISSOLVE / SUMMON
// ═══════════════════════════════════════════════════════════════
const dissolve = {
  phase:'none', phaseTime:0,
  orbitAlpha:1.0, partAlpha:1.0, wireAlpha:1.0,
};

function updateDissolve(dt) {
  if (dissolve.phase==='none'||dissolve.phase==='gone') return;
  dissolve.phaseTime += dt;
  const pt = dissolve.phaseTime;
  if (dissolve.phase==='out') {
    dissolve.orbitAlpha = Math.max(0, 1-easeOut3(pt/0.7));
    dissolve.partAlpha  = Math.max(0, 1-easeOut3(pt/1.2));
    if (pt>=1.2) {
      dissolve.phase='gone'; dissolve.orbitAlpha=0; dissolve.partAlpha=0; dissolve.wireAlpha=0;
    }
  } else if (dissolve.phase==='in') {
    dissolve.orbitAlpha = Math.min(1, easeOut3(pt/1.0));
    if (pt>0.6) dissolve.wireAlpha = Math.min(1, easeOut3((pt-0.6)/0.9));
    dissolve.partAlpha = 0;
    if (pt>=1.5) {
      dissolve.phase='none'; dissolve.orbitAlpha=1; dissolve.partAlpha=1; dissolve.wireAlpha=1;
      if (gState!=='idle') setState('idle');
    }
  }
}
function gideonDismiss() {
  if (dissolve.phase==='out'||dissolve.phase==='gone') return;
  dissolve.phase='out'; dissolve.phaseTime=0;
}
function gideonSummon() {
  if (dissolve.phase==='in') return;
  if (isSpeakCornerActive()) exitSpeakCorner();
  if (think.phase!=='idle') exitThink();
  gState='idle'; _firstSpeak=true;
  dissolve.phase='in'; dissolve.phaseTime=0;
  dissolve.orbitAlpha=0; dissolve.partAlpha=0; dissolve.wireAlpha=0;
  labelEl.style.opacity=''; subEl.style.opacity='';
  document.querySelectorAll('#dev-controls button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-idle').classList.add('active');
}
canvas.addEventListener('click', e=>{
  if (!isSpeakCornerActive()) return;
  const dist = Math.hypot(e.clientX-speakCorner.cornerX, e.clientY-speakCorner.cornerY);
  if (dist < speakCorner.cornerR*2.5) gideonDismiss();
});

// ═══════════════════════════════════════════════════════════════
//  THINK
// ═══════════════════════════════════════════════════════════════
const think = {
  phase:'idle', phaseTime:0,
  targetNX:0, targetNY:0, targetNZ:1, targetRotY:0, targetRotX:0,
  focusGlow:0.0, savedRotY:0, savedRotX:0,
  dotX:0, dotY:0, dotTargetX:0, dotTargetY:0, dotAlpha:0.0,
  cornerX:0, cornerY:0, cornerR:0,
  rebuildAlpha:0.0, drawCX:0, drawCY:0,
};

function _pickThinkTarget() {
  const phi=Math.random()*Math.PI*2, theta=Math.acos(2*Math.random()-1);
  think.targetNX=Math.sin(theta)*Math.cos(phi); think.targetNY=Math.cos(theta);
  think.targetNZ=Math.sin(theta)*Math.sin(phi);
  think.targetRotY=Math.atan2(think.targetNX,think.targetNZ);
  think.targetRotX=-Math.asin(Math.max(-0.99,Math.min(0.99,think.targetNY)));
}
function _thinkCornerPos() {
  think.cornerR=Math.min(W,H)*0.055;
  think.cornerX=W-think.cornerR-28; think.cornerY=H-think.cornerR-28;
}
function enterThink() {
  think.savedRotY=rotY; think.savedRotX=rotX;
  think.focusGlow=0; think.dotAlpha=0; think.rebuildAlpha=0;
  think.drawCX=CX; think.drawCY=CY;
  think.phase='aim'; think.phaseTime=0;
  _pickThinkTarget(); _thinkCornerPos();
}
function exitThink() {
  if (think.phase==='idle') return;
  if (think.phase==='hold') { think.phase='return'; think.phaseTime=0; }
  else if (think.phase!=='return') {
    think.phase='idle'; think.focusGlow=0; think.dotAlpha=0;
    think.rebuildAlpha=0; think.drawCX=CX; think.drawCY=CY;
  }
}
function updateThink(dt) {
  if (think.phase==='idle') return;
  think.phaseTime+=dt;
  const pt=think.phaseTime;
  if (think.phase==='aim') {
    rotY=lerp(rotY,think.targetRotY,0.032); rotX=lerp(rotX,think.targetRotX,0.032);
    if (Math.abs(rotY-think.targetRotY)<0.012&&Math.abs(rotX-think.targetRotX)<0.012) {
      think.phase='pause'; think.phaseTime=0; think.focusGlow=0;
    }
  } else if (think.phase==='pause') {
    think.focusGlow=Math.min(1,pt/0.35);
    if (pt>0.65) {
      const proj=project(think.targetNX,think.targetNY,think.targetNZ,rotY,rotX);
      think.dotX=proj.sx; think.dotY=proj.sy; think.dotAlpha=0;
      think.dotTargetX=think.cornerX; think.dotTargetY=think.cornerY;
      think.phase='dissolveOut'; think.phaseTime=0;
    }
  } else if (think.phase==='dissolveOut') {
    const p=Math.min(1,pt/0.8);
    dissolve.orbitAlpha=Math.max(0,1-easeOut3(p));
    dissolve.partAlpha =Math.max(0,1-easeOut3(p));
    think.focusGlow=1.0; think.dotAlpha=0;
    if (p>=1.0) {
      dissolve.orbitAlpha=0; dissolve.partAlpha=0;
      think.focusGlow=0; think.dotAlpha=1.0;
      think.phase='travel'; think.phaseTime=0;
    }
  } else if (think.phase==='travel') {
    const p=Math.min(1,pt/0.9), ep=easeInOut(p);
    think.dotX=lerp(think.dotX,think.dotTargetX,ep*0.12+0.01);
    think.dotY=lerp(think.dotY,think.dotTargetY,ep*0.12+0.01);
    if (Math.abs(think.dotX-think.dotTargetX)<4&&Math.abs(think.dotY-think.dotTargetY)<4) {
      think.dotX=think.dotTargetX; think.dotY=think.dotTargetY;
      think.drawCX=think.cornerX; think.drawCY=think.cornerY;
      think.rebuildAlpha=0; think.phase='rebuild'; think.phaseTime=0;
    }
  } else if (think.phase==='rebuild') {
    const p=Math.min(1,pt/1.0);
    think.rebuildAlpha=easeOut3(p);
    think.dotAlpha=Math.max(0,1-easeOut3(p*2));
    dissolve.orbitAlpha=think.rebuildAlpha; dissolve.partAlpha=think.rebuildAlpha;
    if (p>=1.0) {
      think.dotAlpha=0; think.rebuildAlpha=1;
      dissolve.orbitAlpha=1; dissolve.partAlpha=1;
      think.phase='hold'; think.phaseTime=0;
    }
  } else if (think.phase==='hold') {
    const cr=think.cornerR;
    think.drawCX=think.cornerX+Math.sin(pt*1.05)*cr*0.06;
    think.drawCY=think.cornerY+Math.sin(pt*0.72+1.0)*cr*0.05;
  } else if (think.phase==='return') {
    const p=Math.min(1,pt/0.7);
    dissolve.orbitAlpha=Math.max(0,1-easeOut3(p));
    dissolve.partAlpha =Math.max(0,1-easeOut3(p));
    think.rebuildAlpha=1-p;
    if (p>=1.0) {
      dissolve.orbitAlpha=1; dissolve.partAlpha=1;
      think.phase='idle'; think.focusGlow=0; think.dotAlpha=0;
      think.rebuildAlpha=0; think.drawCX=CX; think.drawCY=CY;
    }
  }
}

function drawFocusPoint(rY,rX) {
  if (think.focusGlow<0.01) return;
  const {sx,sy}=project(think.targetNX,think.targetNY,think.targetNZ,rY,rX);
  const g=think.focusGlow;
  // OPT: одиночный градиент вместо двух дуг
  const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,R*0.14);
  gr.addColorStop(0,  `rgba(80,180,255,${g*0.90})`);
  gr.addColorStop(0.35,`rgba(60,140,240,${g*0.55})`);
  gr.addColorStop(0.7, `rgba(40,110,210,${g*0.20})`);
  gr.addColorStop(1,   'rgba(30,80,180,0)');
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.arc(sx,sy,R*0.14,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx,sy,R*0.018,0,Math.PI*2);
  ctx.fillStyle=`rgba(230,245,255,${g})`; ctx.fill();
}
function drawTravelDot() {
  if (think.dotAlpha<0.01) return;
  const a=think.dotAlpha, r=5;
  const gr=ctx.createRadialGradient(think.dotX,think.dotY,0,think.dotX,think.dotY,r*5);
  gr.addColorStop(0,  `rgba(100,190,255,${a*0.9})`);
  gr.addColorStop(0.4,`rgba(60,140,230,${a*0.4})`);
  gr.addColorStop(1,  'rgba(40,100,200,0)');
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.arc(think.dotX,think.dotY,r*5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(think.dotX,think.dotY,r,0,Math.PI*2);
  ctx.fillStyle=`rgba(220,242,255,${a})`; ctx.fill();
}
function getDC() {
  if (think.phase==='rebuild'||think.phase==='hold'||think.phase==='return')
    return {dcx:think.drawCX,dcy:think.drawCY};
  if (isSpeakCornerActive()) return {dcx:speakCorner.drawCX,dcy:speakCorner.drawCY};
  return {dcx:CX,dcy:CY};
}
function getSceneScale() {
  if (think.phase==='rebuild'||think.phase==='hold'||think.phase==='return')
    return think.cornerR/(Math.min(W,H)*0.212);
  if (isSpeakCornerActive()) return speakCorner.sceneScale;
  return 1.0;
}

function getSpeakPulse(t) {
  if (gState!=='speak') return 0;
  const pa=cur.partAlpha; if (pa<0.1) return 0;

}
let _listenAmpTarget=0, _listenAmpCur=0;
function setListenAmplitude(v){ _listenAmpTarget=Math.max(0,Math.min(1,v)); }
function getListenAmp(dt) {
  if (gState!=='listen') { _listenAmpTarget=0; _listenAmpCur=lerp(_listenAmpCur,0,0.12); return _listenAmpCur; }
  const speed=_listenAmpTarget>_listenAmpCur?0.18:0.08;
  _listenAmpCur=lerp(_listenAmpCur,_listenAmpTarget,speed);

// ═══════════════════════════════════════════════════════════════
//  3D PROJECTION
// ═══════════════════════════════════════════════════════════════
function project(nx,ny,nz,rY,rX) {
  const cosY=Math.cos(rY),sinY=Math.sin(rY);
  const x1=nx*cosY+nz*sinY, z1=-nx*sinY+nz*cosY;
  const cosX=Math.cos(rX),sinX=Math.sin(rX);
  const y2=ny*cosX-z1*sinX, z2=ny*sinX+z1*cosX;
  const p=3.8/(3.8+z2*0.5);
  const {dcx,dcy}=getDC();
  return {sx:dcx+x1*R*p, sy:dcy-y2*R*p, z:z2, p};
}

// ═══════════════════════════════════════════════════════════════
//  WIREFRAME
//  OPT: dots рисуются простым arc+fillStyle (убран createRadialGradient)
//  OPT: wireStep пропускает каждые N параллелей в low LOD
// ═══════════════════════════════════════════════════════════════
const WIRE={N_MERIDIANS:18, N_PARALLELS:14, CURVE_PTS:120};

function drawMeridian(lonDeg,rY,rX,alpha) {
  const lon=lonDeg*Math.PI/180;
  ctx.beginPath(); let first=true;
  for (let i=0;i<=WIRE.CURVE_PTS;i++) {
    const lat=-Math.PI/2+Math.PI*(i/WIRE.CURVE_PTS);
    const {sx,sy}=project(Math.cos(lat)*Math.sin(lon),Math.sin(lat),Math.cos(lat)*Math.cos(lon),rY,rX);
    if(first){ctx.moveTo(sx,sy);first=false;}else ctx.lineTo(sx,sy);
  }
  ctx.strokeStyle=`rgba(45,95,165,${alpha})`; ctx.globalAlpha=1; ctx.lineWidth=1.1; ctx.stroke();
}

function drawParallel(latDeg,rY,rX,alpha) {
  const lat=latDeg*Math.PI/180, cosLat=Math.cos(lat), sinLat=Math.sin(lat);
  const pts=[];
  for (let i=0;i<=WIRE.CURVE_PTS;i++) {
    const lon=-Math.PI+Math.PI*2*(i/WIRE.CURVE_PTS);
    pts.push(project(cosLat*Math.sin(lon),sinLat,cosLat*Math.cos(lon),rY,rX));
  }
  ctx.beginPath();
  pts.forEach(({sx,sy},i)=>{ if(i===0)ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
  ctx.strokeStyle=`rgba(45,95,165,${alpha})`; ctx.lineWidth=1.1; ctx.stroke();

  // OPT: wireframe dots — убираем createRadialGradient, используем простой fillStyle
  // Визуально почти идентично при alpha < 0.8
  const cfg = LOD.cfg;
  for (let m=0;m<WIRE.N_MERIDIANS;m++) {
    const lon=(m/WIRE.N_MERIDIANS)*Math.PI*2-Math.PI;
    const {sx,sy,z,p}=project(cosLat*Math.sin(lon),sinLat,cosLat*Math.cos(lon),rY,rX);
    const vis=Math.max(0.1,Math.min(1,(z+1.3)/1.4));
    const dotR=R*0.021*p*(0.7+0.3*vis);

    if (cfg.dotGradient) {
      // HIGH LOD: полный градиент (только для speak/listen)
      const gr=ctx.createRadialGradient(sx-dotR*0.3,sy-dotR*0.3,dotR*0.05,sx,sy,dotR);
      gr.addColorStop(0,  `rgba(220,240,255,${vis*alpha*1.2})`);
      gr.addColorStop(0.5,`rgba(100,170,230,${vis*alpha*0.9})`);
      gr.addColorStop(1,  `rgba(50,110,200,${vis*alpha*0.5})`);
      ctx.fillStyle=gr;
    } else {
      // LOW/MID LOD: простой fillStyle — ~12x быстрее
      ctx.fillStyle=`rgba(100,160,220,${vis*alpha*0.85})`;
    }
    ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(sx,sy,dotR,0,Math.PI*2); ctx.fill();
  }
}

function drawWireframe(rY,rX) {
  const a=cur.wireAlpha*(0.5+0.5*cur.energy);
  if (a<0.01) return;
  const wireStep=LOD.cfg.wireStep;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  for (let m=0;m<WIRE.N_MERIDIANS;m++)
    drawMeridian((m/WIRE.N_MERIDIANS)*360-180,rY,rX,a*0.78);
  for (let p=0;p<=WIRE.N_PARALLELS;p++) {
    // OPT: wireStep=2 пропускает каждую вторую параллель в low LOD
    if (p % wireStep !== 0) continue;
    const latDeg=-90+180*(p/WIRE.N_PARALLELS);
    if (Math.abs(latDeg)>82) continue;
    drawParallel(latDeg,rY,rX,a*0.78);
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  PARTICLE SYSTEM
//
//  OPT 1: buildParticles создаёт ВСЕ 1728 частиц один раз,
//         но хранит в triples: [nx,ny,nz, phase,speed,size,bright, col,row]
//         Никаких объектов — TypedArray для проекций
//
//  OPT 2: LOD.partStep управляет прореживанием:
//         step=1: все частицы (high),  step=2: каждая 2-я (mid), step=3: каждая 3-я (low)
//
//  OPT 3: sort() заменён на ПРЕДВАРИТЕЛЬНО ОТСОРТИРОВАННЫЕ индексы,
//         которые пересчитываются раз в SORT_INTERVAL кадров
//
//  OPT 4: projected — pre-allocated Float32Array (нет new Object каждый кадр)
//
//  OPT 5: createRadialGradient на частицах в LOW/MID LOD заменён на
//         fillStyle с alpha-only — экономия ~3ms/frame
// ═══════════════════════════════════════════════════════════════
const PART_COLS=48, PART_ROWS=36, PART_TOTAL=PART_COLS*PART_ROWS; // 1728

// Статические данные частиц: TypedArray
const _pNX    = new Float32Array(PART_TOTAL);
const _pNY    = new Float32Array(PART_TOTAL);
const _pNZ    = new Float32Array(PART_TOTAL);
const _pPhase = new Float32Array(PART_TOTAL);
const _pSpeed = new Float32Array(PART_TOTAL);
const _pSize  = new Float32Array(PART_TOTAL);
const _pBright= new Float32Array(PART_TOTAL);

// Pre-allocated проекции (пересчёт каждый кадр)
const _prjSX  = new Float32Array(PART_TOTAL);
const _prjSY  = new Float32Array(PART_TOTAL);
const _prjZ2  = new Float32Array(PART_TOTAL);
const _prjDep = new Float32Array(PART_TOTAL);
const _prjBri = new Float32Array(PART_TOTAL);
const _prjDotR= new Float32Array(PART_TOTAL);

// Индексы для сортировки (обновляются раз в N кадров)
const _sortIdx = new Int32Array(PART_TOTAL);
let _sortFrame = 0;
const SORT_INTERVAL = 4; // пересортировать раз в 4 кадра

function buildParticles() {
  let i=0;
  for (let c=0;c<PART_COLS;c++) {
    const lon=(c/PART_COLS)*Math.PI*2;
    for (let r=0;r<PART_ROWS;r++,i++) {
      const lat=-Math.PI/2+Math.PI*((r+0.5)/PART_ROWS);
      _pNX[i]=Math.cos(lat)*Math.sin(lon);
      _pNY[i]=Math.sin(lat);
      _pNZ[i]=Math.cos(lat)*Math.cos(lon);
      _pPhase[i]=Math.random()*Math.PI*2;
      _pSpeed[i]=0.6+Math.random()*1.4;
      _pSize[i] =0.012+Math.random()*0.010;
      _pBright[i]=0.5+Math.random()*0.5;
      _sortIdx[i]=i;
    }
  }
}

// OPT: Проекция всех частиц в pre-allocated arrays (без аллокаций)
function projectParticles(cosRY,sinRY,cosRX,sinRX,t,dcx,dcy) {
  const freq=cur.siriFreq, amp=cur.siriAmp;
  for (let i=0;i<PART_TOTAL;i++) {
    const nx=_pNX[i],ny=_pNY[i],nz=_pNZ[i];
    const x1= nx*cosRY+nz*sinRY;
    const z1=-nx*sinRY+nz*cosRY;
    const y2= ny*cosRX-z1*sinRX;
    const z2= ny*sinRX+z1*cosRX;
    const wavePhase=ny*3.0+t*freq+_pPhase[i]*0.2;
    const rr=1.0+Math.sin(wavePhase)*amp;
    _prjSX[i]=dcx+x1*R*rr;
    _prjSY[i]=dcy-y2*R*rr;
    _prjZ2[i]=z2;
    const depth=(z2+1)*0.5;
    _prjDep[i]=depth;
    _prjBri[i]=depth*_pBright[i]*(0.55+0.45*Math.sin(t*_pSpeed[i]+_pPhase[i]));
    const edgeF=Math.sqrt(Math.max(0,1-ny*ny));
    _prjDotR[i]=R*_pSize[i]*(0.4+0.6*depth)*(0.5+0.5*edgeF);
  }
}

// OPT: Редкая пересортировка (раз в SORT_INTERVAL кадров)
function maybeSortParticles(frame) {
  if (frame % SORT_INTERVAL !== 0) return;
  // Сортируем _sortIdx по _prjZ2 (back-to-front)
  // Используем insertion sort для небольших дельт между кадрами — O(n) для почти-отсортированных
  for (let i=1;i<PART_TOTAL;i++) {
    const idx=_sortIdx[i];
    const z=_prjZ2[idx];
    let j=i-1;
    while (j>=0 && _prjZ2[_sortIdx[j]]>z) {
      _sortIdx[j+1]=_sortIdx[j]; j--;
    }
    _sortIdx[j+1]=idx;
  }
}

function drawParticles(rY,rX,t,brightMult) {
  const pa=cur.partAlpha;
  if (pa<0.01) return;

  const cosRY=Math.cos(rY),sinRY=Math.sin(rY);
  const cosRX=Math.cos(rX),sinRX=Math.sin(rX);
  const {dcx,dcy}=getDC();
  const PI2=Math.PI*2;

  projectParticles(cosRY,sinRY,cosRX,sinRX,t,dcx,dcy);
  maybeSortParticles(_frameCount);

  const brightBoost=1.0+brightMult*0.45;
  const step=LOD.cfg.partStep;
  const useGradient=LOD.cfg.dotGradient;

  for (let si=0;si<PART_TOTAL;si+=step) {
    const i=_sortIdx[si];
    const bright=_prjBri[i];
    if (bright<0.04) continue;
    const sx=_prjSX[i], sy=_prjSY[i];
    const depth=_prjDep[i], dotR=_prjDotR[i];
    const rim=1.0+(1-depth)*1.1;
    const finalB=Math.min(1,bright*rim*(0.6+0.4*cur.energy)*brightBoost)*pa;

    if (useGradient) {
      // HIGH LOD: полный радиальный градиент
      const gr=ctx.createRadialGradient(sx-dotR*0.2,sy-dotR*0.2,0,sx,sy,dotR*2.5);
      gr.addColorStop(0,  `rgba(60,130,230,${finalB*0.55})`);
      gr.addColorStop(0.4,`rgba(40,100,200,${finalB*0.22})`);
      gr.addColorStop(1,  'rgba(20,70,170,0)');
      ctx.fillStyle=gr;
      ctx.beginPath(); ctx.arc(sx,sy,dotR*2.5,0,PI2); ctx.fill();
    }
    // Все уровни: яркое ядро точки
    ctx.beginPath(); ctx.arc(sx,sy,dotR,0,PI2);
    ctx.fillStyle=`rgba(50,120,220,${finalB})`; ctx.fill();
  }

  // Ободок (только mid/high)
  if (LOD.current !== 'low') {
    const rim1=ctx.createRadialGradient(dcx,dcy,R*0.82,dcx,dcy,R*1.00);
    rim1.addColorStop(0,  'rgba(80,140,220,0)');
    rim1.addColorStop(0.8,`rgba(60,120,200,${0.06*cur.energy*pa})`);
    rim1.addColorStop(1,  'rgba(40,100,180,0)');
    ctx.fillStyle=rim1;
    ctx.beginPath(); ctx.arc(dcx,dcy,R*1.00,0,PI2); ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════════
//  ORBITS
// ═══════════════════════════════════════════════════════════════
const ORBITS=[
  {tiltX:0.52,tiltZ:0.30,rotSpd:0.60,ph:0.00,rm:1.55,lw:1.6,a:0.55},
  {tiltX:-0.42,tiltZ:0.68,rotSpd:-0.48,ph:1.05,rm:1.63,lw:1.4,a:0.50},
  {tiltX:1.08,tiltZ:-0.28,rotSpd:0.40,ph:2.10,rm:1.72,lw:1.2,a:0.44},
  {tiltX:-0.78,tiltZ:-0.52,rotSpd:-0.34,ph:3.14,rm:1.82,lw:1.1,a:0.38},
  {tiltX:0.30,tiltZ:0.22,rotSpd:0.52,ph:0.70,rm:1.94,lw:1.0,a:0.30},
];

// OPT: кешируем тригонометрию наклонов (не зависит от времени)
const _orbitCache = ORBITS.map(o=>({
  cTx:Math.cos(o.tiltX), sTx:Math.sin(o.tiltX),
  cTz:Math.cos(o.tiltZ), sTz:Math.sin(o.tiltZ),
}));

function drawOrbit(o,cache,t,alphaMultiplier) {
  if (alphaMultiplier<0.005) return;
  const rotAngle=t*o.rotSpd*cur.spd+o.ph;
  const orbitR=R*o.rm, N=160;
  // OPT: тригонометрия вращения — за пределами цикла
  const cR=Math.cos(rotAngle), sR=Math.sin(rotAngle);
  const {cTx,sTx,cTz,sTz}=cache;
  const {dcx,dcy}=getDC();

  ctx.beginPath();
  for (let i=0;i<=N;i++) {
    const theta=(i/N)*Math.PI*2;
    let x=Math.cos(theta)*orbitR, y=Math.sin(theta)*orbitR, z=0;
    const yr1=y*cTx-z*sTx, zr1=y*sTx+z*cTx; y=yr1; z=zr1;
    const xr1=x*cTz-y*sTz, yr2=x*sTz+y*cTz; x=xr1; y=yr2;
    const xr2=x*cR+z*sR,   zr2=-x*sR+z*cR;  x=xr2; z=zr2;
    const persp=1/(1+z*0.00018);
    if(i===0) ctx.moveTo(dcx+x*persp,dcy+y*persp*0.90);
    else       ctx.lineTo(dcx+x*persp,dcy+y*persp*0.90);
  }
  const alpha=o.a*Math.min(1,cur.energy*1.2+0.45)*alphaMultiplier;
  ctx.strokeStyle=`rgba(50,100,190,${alpha*0.16})`; ctx.lineWidth=o.lw*7; ctx.stroke();
  ctx.strokeStyle=`rgba(55,105,195,${alpha*0.82})`; ctx.lineWidth=o.lw;   ctx.stroke();
}
function drawOrbits(t,far,alphaMultiplier=1.0) {
  ORBITS.forEach((o,idx)=>{
    if (far ? o.rm>1.6 : o.rm<=1.6) drawOrbit(o,_orbitCache[idx],t,alphaMultiplier);
  });
}

function drawPulseRings(_t){ /* убраны */ }

// ═══════════════════════════════════════════════════════════════
//  RENDER LOOP
//  OPT: frame budget — если предыдущий кадр занял >33ms, пропускаем
//       тяжёлые эффекты (ободок, second orbit pass)
// ═══════════════════════════════════════════════════════════════
const startT=performance.now();
let lastT=0, _frameCount=0, _lastFrameMs=0;

function draw() {
  const nowMs=performance.now();

  if (!sleepMode&&nowMs-lastActivity>SLEEP_AFTER) sleepMode=true;
  if (sleepMode) {
    sleepTimer=setTimeout(()=>{sleepTimer=null;requestAnimationFrame(draw);},1000);
    return;
  }

  requestAnimationFrame(draw);
  _frameCount++;

  const now=(nowMs-startT)/1000;
  const dt=Math.min(now-lastT,0.05);
  lastT=now;
  const t=now;

  // Frame budget: если последний кадр > 33ms — помечаем как "slow"
  const frameSlow=_lastFrameMs>33;
  const frameStart=performance.now();

  lerpState();
  updateThink(dt);
  updateSpeakCorner(dt);
  updateDissolve(dt);

  const speakPulse=getSpeakPulse(t);
  const listenAmp=getListenAmp(dt);
  const brightMult=Math.max(speakPulse,listenAmp);

  const thinkOwnsRot=think.phase==='aim'||think.phase==='pause';
  if (!thinkOwnsRot) {
    rotY+=(mx*0.33-rotY)*0.04;
    rotX+=(my*0.17-rotX)*0.04;
  }

  const rY=rotY+t*cur.spd*0.32;
  const rX=rotX+Math.sin(t*0.55)*0.038;

  const savedR=R;
  const scl=getSceneScale();
  if (Math.abs(scl-1.0)>0.0005) R=savedR*scl; // eslint-disable-line

  ctx.clearRect(0,0,W,H);

  const dOA=dissolve.orbitAlpha;
  const dPA=dissolve.partAlpha;
  const dWA=dissolve.wireAlpha;

  const savedWireAlpha=cur.wireAlpha;
  if (dissolve.phase==='in') cur.wireAlpha=dWA;
  const savedPartAlpha=cur.partAlpha;
  cur.partAlpha=cur.partAlpha*dPA;

  // OPT: дальние орбиты пропускаем в slow-frame
  if (!frameSlow) drawOrbits(t,true,dOA);

  const {dcx,dcy}=getDC();
  const glowBoost=1.0+think.focusGlow*0.5;
  const glowR=R*1.12;
  const glow=ctx.createRadialGradient(dcx,dcy,R*0.5,dcx,dcy,glowR*1.4);
  glow.addColorStop(0,  `rgba(80,140,230,${0.11*cur.energy*glowBoost})`);
  glow.addColorStop(0.5,`rgba(60,110,200,${0.04*cur.energy*glowBoost})`);
  glow.addColorStop(1,  'rgba(40,80,180,0)');
  ctx.fillStyle=glow;
  ctx.beginPath(); ctx.arc(dcx,dcy,glowR*1.4,0,Math.PI*2); ctx.fill();

  drawWireframe(rY,rX);
  drawParticles(rY,rX,t,brightMult);
  drawFocusPoint(rY,rX);
  drawTravelDot();
  drawOrbits(t,false,dOA);
  drawPulseRings(t);

  cur.partAlpha=savedPartAlpha;
  cur.wireAlpha=savedWireAlpha;
  R=savedR; // eslint-disable-line

  _lastFrameMs=performance.now()-frameStart;
}

// ── СТАРТ ──
resize();
speakCorner.drawCX=CX; speakCorner.drawCY=CY;
requestAnimationFrame(draw);
</script>
</body>
