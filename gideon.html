<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GIDEON</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@300;600;900&display=swap');

/* ─── RESET & BASE ─────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 44%,
    #e8f4ff 0%, #c8dff5 30%, #aacae8 60%, #8fb8d8 100%);
}

canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

/* ─── LABEL ────────────────────────────────────────────────────── */
#gideon-label {
  position: fixed;
  bottom: 52px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Orbitron', 'Courier New', monospace;
  font-size: clamp(30px, 4.5vw, 54px);
  font-weight: 600;
  letter-spacing: clamp(12px, 2.5vw, 24px);
  color: rgba(40, 95, 170, 0.62);
  pointer-events: none; white-space: nowrap;
  text-shadow: 0 0 40px rgba(80,160,255,0.20), 0 2px 8px rgba(20,60,140,0.12);
  animation: breathe 4s ease-in-out infinite alternate;
  transition: opacity 0.8s ease;
}
@keyframes breathe {
  from { opacity: .44; letter-spacing: clamp(11px,2.3vw,22px); }
  to   { opacity: .68; letter-spacing: clamp(13px,2.7vw,26px); }
}

/* ─── STATUS ───────────────────────────────────────────────────── */
#sub {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 5px;
  color: rgba(50, 110, 190, 0.32); pointer-events: none;
  white-space: nowrap; text-transform: uppercase;
  transition: opacity 0.4s ease;
}

/* ─── DEV CONTROLS ──────────────────────────────────────────────── */
#dev-controls {
  position: fixed; top: 18px; right: 18px;
  display: flex; gap: 8px; z-index: 100;
}
#dev-controls button {
  font-family: 'Courier New', monospace; font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase;
  padding: 6px 12px; border-radius: 2px; cursor: pointer;
  background: rgba(200, 220, 245, 0.80); border: 1px solid rgba(60,120,210,0.30);
  color: rgba(40,90,170,0.80); transition: all 0.2s;
}
#dev-controls button:hover  { background: rgba(180,210,240,0.90); border-color: rgba(60,140,220,0.55); }
#dev-controls button.active { background: rgba(80,140,220,0.85); border-color: rgba(60,140,220,0.80); color: #fff; }
#btn-anim-test { border-color: rgba(80,160,255,0.50) !important; color: rgba(40,100,200,0.90) !important; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="gideon-label">GIDEON</div>
<div id="sub">NEURAL CORE ACTIVE</div>

<div id="dev-controls">
  <button onclick="setState('idle')"    id="btn-idle">IDLE</button>
  <button onclick="setState('think')"   id="btn-think">THINK</button>
  <button onclick="setState('listen')"  id="btn-listen">LISTEN</button>
  <button onclick="setState('speak')"   id="btn-speak">SPEAK</button>
  <button onclick="runAnimationTest()"  id="btn-anim-test">ANIMATION TEST</button>
  <button onclick="gideonDismiss()"     id="btn-dismiss" style="border-color:rgba(200,80,80,0.45)!important;color:rgba(180,60,60,0.9)!important;">DISMISS</button>
  <button onclick="gideonSummon()"      id="btn-summon"  style="border-color:rgba(60,180,100,0.45)!important;color:rgba(40,160,80,0.9)!important;">SUMMON</button>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  CANVAS & CONTEXT
// ═══════════════════════════════════════════════════════════════
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const subEl   = document.getElementById('sub');
const labelEl = document.getElementById('gideon-label');

let W, H, CX, CY, R;

function resize() {
  W  = canvas.width  = window.innerWidth;
  H  = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2 - 30;
  R  = Math.min(W, H) * 0.212;
  buildParticles();
  if (speakCorner && speakCorner.phase !== 'idle') {
    speakCorner.cornerR = Math.min(W, H) * 0.060;
    speakCorner.cornerX = W - speakCorner.cornerR - 28;   // правый
    speakCorner.cornerY = H - speakCorner.cornerR - 28;
  }
}
window.addEventListener('resize', resize);


// ═══════════════════════════════════════════════════════════════
//  STATE MACHINE
// ═══════════════════════════════════════════════════════════════
const STATE_LABELS = {
  idle:   'NEURAL CORE ACTIVE',
  listen: 'LISTENING...',
  speak:  'SPEAKING...',
  think:  'PROCESSING...',
};

const STATE_PARAMS = {
  idle:   { wireAlpha: 1.00, partAlpha: 0.00, energy: 0.30, spd: 0.22, siriAmp: 0.012, siriFreq: 1.0 },
  think:  { wireAlpha: 0.00, partAlpha: 0.70, energy: 0.48, spd: 0.38, siriAmp: 0.018, siriFreq: 1.2 },
  listen: { wireAlpha: 0.00, partAlpha: 0.95, energy: 0.72, spd: 0.70, siriAmp: 0.040, siriFreq: 1.8 },
  speak:  { wireAlpha: 0.00, partAlpha: 1.00, energy: 0.85, spd: 0.55, siriAmp: 0.022, siriFreq: 1.4 },
};

// ─── SPEAK CORNER ────────────────────────────────────────────────
// При первом speak (приветствие) — сфера остаётся по центру.
// При последующих speak (ответ на задачу) — уходит в левый нижний угол.
//
// Фазы speakCorner.phase:
//   'idle'    — не активен
//   'goCorner'— плавно уходит в угол (1.0 сек)
//   'inCorner'— в углу, говорит, лёгкое микро-движение
//   'return'  — возврат в центр
//
const speakCorner = {
  phase      : 'idle',
  phaseTime  : 0,
  drawCX     : 0,  drawCY: 0,
  cornerX    : 0,  cornerY: 0, cornerR: 0,
  sceneScale : 1.0,
};

// true — первый speak (приветствие), остаётся по центру
let _firstSpeak = true;

function enterSpeakCorner() {
  // Первый speak — приветствие, не уходим в угол
  if (_firstSpeak) {
    _firstSpeak = false;
    speakCorner.phase = 'idle'; // остаётся в idle — никуда не двигается
    return;
  }
  // Последующие speak — правый нижний угол
  speakCorner.cornerR     = Math.min(W, H) * 0.060;
  speakCorner.cornerX     = W - speakCorner.cornerR - 28;   // правый
  speakCorner.cornerY     = H - speakCorner.cornerR - 28;
  speakCorner.drawCX      = CX;
  speakCorner.drawCY      = CY;
  speakCorner.sceneScale  = 1.0;
  speakCorner.phase       = 'goCorner';
  speakCorner.phaseTime   = 0;
  labelEl.style.transition = 'opacity 0.5s ease';
  labelEl.style.opacity    = '0';
  subEl.style.transition   = 'opacity 0.5s ease';
  subEl.style.opacity      = '0';
}

function exitSpeakCorner() {
  if (speakCorner.phase === 'inCorner' || speakCorner.phase === 'goCorner') {
    speakCorner.phase    = 'return';
    speakCorner.phaseTime = 0;
  }
}

function updateSpeakCorner(dt) {
  if (speakCorner.phase === 'idle') return;
  speakCorner.phaseTime += dt;
  const pt = speakCorner.phaseTime;

  if (speakCorner.phase === 'goCorner') {
    const dur = 1.0;
    const p   = Math.min(1, pt / dur);
    const ep  = easeOut3(p);
    speakCorner.drawCX    = lerp(CX, speakCorner.cornerX, ep);
    speakCorner.drawCY    = lerp(CY, speakCorner.cornerY, ep);
    speakCorner.sceneScale= lerp(1.0, speakCorner.cornerR / R, ep);
    if (p >= 1.0) {
      speakCorner.phase    = 'inCorner';
      speakCorner.phaseTime = 0;
    }

  } else if (speakCorner.phase === 'inCorner') {
    const cr = speakCorner.cornerR;
    speakCorner.drawCX    = speakCorner.cornerX + Math.sin(pt * 1.1)  * cr * 0.06;
    speakCorner.drawCY    = speakCorner.cornerY + Math.sin(pt * 0.75 + 0.8) * cr * 0.05;
    speakCorner.sceneScale= speakCorner.cornerR / R * (1.0 + Math.sin(pt * 0.9) * 0.03);

  } else if (speakCorner.phase === 'return') {
    speakCorner.drawCX    = lerp(speakCorner.drawCX,    CX,  0.07);
    speakCorner.drawCY    = lerp(speakCorner.drawCY,    CY,  0.07);
    speakCorner.sceneScale= lerp(speakCorner.sceneScale,1.0, 0.07);
    if (Math.abs(speakCorner.drawCX - CX) < 2 && speakCorner.sceneScale > 0.98) {
      speakCorner.phase    = 'idle';
      speakCorner.sceneScale = 1.0;
      speakCorner.drawCX   = CX;
      speakCorner.drawCY   = CY;
      // Возвращаем label и sub
      labelEl.style.opacity = '';
      subEl.style.opacity   = '';
    }
  }
}

// Возвращает true если speak-corner активен и управляет позицией
function isSpeakCornerActive() {
  return speakCorner.phase === 'goCorner' || speakCorner.phase === 'inCorner' || speakCorner.phase === 'return';
}

let gState = 'idle';
let cur    = { ...STATE_PARAMS.idle };
Object.defineProperty(cur, 'transitionProgress', { get() { return this.partAlpha; } });

const lerp     = (a, b, t) => a + (b - a) * t;
const LERP_SPD = 0.035;

function lerpState() {
  const tgt = STATE_PARAMS[gState] || STATE_PARAMS.idle;
  for (const k in tgt) cur[k] = lerp(cur[k], tgt[k], LERP_SPD);
}

function setState(state) {
  if (!STATE_PARAMS[state]) return;
  const prev = gState;
  gState = state;
  subEl.textContent = STATE_LABELS[state] || '';

  // ── THINK: только для задач ──────────────────────────────────
  if (state === 'think' && prev !== 'think') enterThink();
  if (state !== 'think' && prev === 'think') exitThink();

  // ── SPEAK: без think-анимации, перемещается в угол ───────────
  if (state === 'speak' && prev !== 'speak') enterSpeakCorner();
  if (state !== 'speak' && prev === 'speak') exitSpeakCorner();

  document.querySelectorAll('#dev-controls button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + state);
  if (btn) btn.classList.add('active');
}
setState('idle');


// ═══════════════════════════════════════════════════════════════
//  WEBSOCKET
// ═══════════════════════════════════════════════════════════════
(function connectWS() {
  try {
    const s = new WebSocket('ws://localhost:8765');
    s.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        if (m.state) setState(m.state);
        // amplitude [0..1] — громкость голоса пользователя в listen
        if (typeof m.amplitude === 'number') setListenAmplitude(m.amplitude);
      } catch (_) {}
    };
    s.onclose = () => setTimeout(connectWS, 3000);
    s.onerror = () => s.close();
  } catch (_) { setTimeout(connectWS, 3000); }
})();


// ═══════════════════════════════════════════════════════════════
//  МЫШЬ
// ═══════════════════════════════════════════════════════════════
let mx = 0, my = 0, rotY = 0, rotX = 0;
window.addEventListener('mousemove', e => {
  mx = (e.clientX / W - 0.5) * 2;
  my = (e.clientY / H - 0.5) * 2;
});


// ═══════════════════════════════════════════════════════════════
//  EASING
// ═══════════════════════════════════════════════════════════════
const easeInOut = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3) / 2;
const easeOut3  = x => 1 - Math.pow(1 - x, 3);


// ═══════════════════════════════════════════════════════════════
//  DISSOLVE / SUMMON — распад и сборка
//
//  dissolve.phase:
//    'none'    — не активен, всё нормально
//    'out'     — распад: кольца→0, частицы→0 (1.2 сек)
//    'gone'    — полностью исчез, loop замедлен
//    'in'      — сборка: сначала кольца (0→1), затем wireframe (0→1)
//
//  Управляет двумя множителями, которые render loop умножает
//  на обычные alpha:
//    dissolve.orbitAlpha  [0..1] — прозрачность колец
//    dissolve.partAlpha   [0..1] — прозрачность частиц
//    dissolve.wireAlpha   [0..1] — прозрачность wireframe (только при summon)
// ═══════════════════════════════════════════════════════════════
const dissolve = {
  phase      : 'none',
  phaseTime  : 0,
  orbitAlpha : 1.0,   // множитель прозрачности колец
  partAlpha  : 1.0,   // множитель прозрачности частиц
  wireAlpha  : 1.0,   // множитель прозрачности wireframe при summon
};

function updateDissolve(dt) {
  if (dissolve.phase === 'none' || dissolve.phase === 'gone') return;
  dissolve.phaseTime += dt;
  const pt = dissolve.phaseTime;

  if (dissolve.phase === 'out') {
    // Кольца уходят быстрее (0.7 сек), частицы медленнее (1.2 сек)
    const durOrbit = 0.7;
    const durPart  = 1.2;
    dissolve.orbitAlpha = Math.max(0, 1 - easeOut3(pt / durOrbit));
    dissolve.partAlpha  = Math.max(0, 1 - easeOut3(pt / durPart));
    if (pt >= durPart) {
      dissolve.phase      = 'gone';
      dissolve.orbitAlpha = 0;
      dissolve.partAlpha  = 0;
      dissolve.wireAlpha  = 0;
    }

  } else if (dissolve.phase === 'in') {
    // Сначала кольца (0→1 за 1.0 сек), затем wireframe (0→1 за 0.8 сек, старт с 0.6)
    const durOrbit     = 1.0;
    const wireStart    = 0.6;
    const durWire      = 0.9;
    dissolve.orbitAlpha = Math.min(1, easeOut3(pt / durOrbit));
    if (pt > wireStart) {
      dissolve.wireAlpha = Math.min(1, easeOut3((pt - wireStart) / durWire));
    }
    dissolve.partAlpha = 0; // частицы не появляются при summon
    if (pt >= wireStart + durWire) {
      // Сборка завершена — выходим в idle
      dissolve.phase      = 'none';
      dissolve.orbitAlpha = 1;
      dissolve.partAlpha  = 1;
      dissolve.wireAlpha  = 1;
      // Возвращаем состояние idle (если ещё не там)
      if (gState !== 'idle') setState('idle');
    }
  }
}

// ── Публичный API ─────────────────────────────────────────────
// Вызывается при клике на сферу в углу ИЛИ из внешнего кода
function gideonDismiss() {
  if (dissolve.phase === 'out' || dissolve.phase === 'gone') return;
  dissolve.phase    = 'out';
  dissolve.phaseTime = 0;
}

// Вызывается когда пользователь снова активирует Гидеона
function gideonSummon() {
  if (dissolve.phase === 'in') return;
  if (isSpeakCornerActive()) exitSpeakCorner();
  if (think.phase !== 'idle') exitThink();
  gState = 'idle';
  _firstSpeak = true;   // следующий speak снова будет приветствием по центру
  dissolve.phase      = 'in';
  dissolve.phaseTime  = 0;
  dissolve.orbitAlpha = 0;
  dissolve.partAlpha  = 0;
  dissolve.wireAlpha  = 0;
  labelEl.style.opacity = '';
  subEl.style.opacity   = '';
  document.querySelectorAll('#dev-controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-idle').classList.add('active');
}

// ── Клик по canvas: если speak в левом нижнем углу — dismiss ────
canvas.addEventListener('click', e => {
  if (!isSpeakCornerActive()) return;
  const dist = Math.hypot(e.clientX - speakCorner.cornerX, e.clientY - speakCorner.cornerY);
  if (dist < speakCorner.cornerR * 2.5) gideonDismiss();
});
// ═══════════════════════════════════════════════════════════════
//  THINK — новый сценарий
//
//  Фазы:
//    'idle'       — не активен
//    'aim'        — вращение к точке (мышь заблокирована)
//    'pause'      — точка подсвечивается (~0.5 сек), сфера стоит
//    'dissolveOut'— сфера/кольца исчезают (dissolve-эффект), точка остаётся
//    'travel'     — одиночная точка перемещается в левый нижний угол
//    'rebuild'    — в углу сфера собирается из точки (маленькая)
//    'hold'       — Гидеон в углу, работает (ждём exitThink)
//    'return'     — сфера растворяется в углу, возвращается в центр как idle
//
//  НЕТ zoom (отдаления камеры).
//  Точка во время travel — это canvas-круг, рисуется напрямую.
// ═══════════════════════════════════════════════════════════════
const think = {
  phase     : 'idle',
  phaseTime : 0,

  // Целевая точка на сфере
  targetNX  : 0, targetNY: 0, targetNZ: 1,
  targetRotY: 0, targetRotX: 0,

  // Свечение маркера [0..1]
  focusGlow : 0.0,

  // Сохранённые углы для return
  savedRotY : 0, savedRotX: 0,

  // Экранная позиция точки (используется в travel)
  dotX : 0, dotY: 0,       // текущая позиция точки
  dotTargetX: 0, dotTargetY: 0,  // целевая (угол)
  dotAlpha  : 0.0,          // прозрачность одиночной точки

  // Параметры угла (левый нижний)
  cornerX   : 0, cornerY: 0, cornerR: 0,

  // Alpha сферы в углу (для rebuild)
  rebuildAlpha : 0.0,

  // Центр рисования в фазах rebuild/hold
  drawCX : 0, drawCY: 0,
};

function _pickThinkTarget() {
  const phi        = Math.random() * Math.PI * 2;
  const theta      = Math.acos(2 * Math.random() - 1);
  think.targetNX   = Math.sin(theta) * Math.cos(phi);
  think.targetNY   = Math.cos(theta);
  think.targetNZ   = Math.sin(theta) * Math.sin(phi);
  think.targetRotY = Math.atan2(think.targetNX, think.targetNZ);
  think.targetRotX = -Math.asin(Math.max(-0.99, Math.min(0.99, think.targetNY)));
}

function _thinkCornerPos() {
  think.cornerR = Math.min(W, H) * 0.055;
  think.cornerX = W - think.cornerR - 28;   // правый нижний угол
  think.cornerY = H - think.cornerR - 28;
}

function enterThink() {
  think.savedRotY    = rotY;
  think.savedRotX    = rotX;
  think.focusGlow    = 0.0;
  think.dotAlpha     = 0.0;
  think.rebuildAlpha = 0.0;
  think.drawCX       = CX;
  think.drawCY       = CY;
  think.phase        = 'aim';
  think.phaseTime    = 0;
  _pickThinkTarget();
  _thinkCornerPos();

}

function exitThink() {
  if (think.phase === 'idle') return;
  // Если уже в углу — просто гасим индикатор и возвращаемся

  if (think.phase === 'hold') {
    think.phase    = 'return';
    think.phaseTime = 0;
  } else if (think.phase !== 'return') {
    // Прерываем на любой фазе — мгновенный сброс
    think.phase        = 'idle';
    think.focusGlow    = 0.0;
    think.dotAlpha     = 0.0;
    think.rebuildAlpha = 0.0;
    think.drawCX       = CX;
    think.drawCY       = CY;
  }
}

function updateThink(dt) {
  if (think.phase === 'idle') return;
  think.phaseTime += dt;
  const pt = think.phaseTime;

  // ── AIM ── вращение к точке ──────────────────────────────────
  if (think.phase === 'aim') {
    rotY = lerp(rotY, think.targetRotY, 0.032);
    rotX = lerp(rotX, think.targetRotX, 0.032);
    if (Math.abs(rotY - think.targetRotY) < 0.012 &&
        Math.abs(rotX - think.targetRotX) < 0.012) {
      think.phase    = 'pause';
      think.phaseTime = 0;
      think.focusGlow = 0;
    }

  // ── PAUSE ── точка подсвечивается, всё стоит ─────────────────
  } else if (think.phase === 'pause') {
    think.focusGlow = Math.min(1, pt / 0.35);
    if (pt > 0.65) {
      // Запоминаем экранные координаты точки для travel
      const proj = project(think.targetNX, think.targetNY, think.targetNZ, rotY, rotX);
      think.dotX       = proj.sx;
      think.dotY       = proj.sy;
      think.dotAlpha   = 0;          // НЕ показываем dot пока идёт dissolveOut
      think.dotTargetX = think.cornerX;
      think.dotTargetY = think.cornerY;
      think.phase    = 'dissolveOut';
      think.phaseTime = 0;
    }

  // ── DISSOLVE OUT ── сфера и кольца исчезают, точка (focusGlow) светится ──
  } else if (think.phase === 'dissolveOut') {
    const dur = 0.8;
    const p   = Math.min(1, pt / dur);
    dissolve.orbitAlpha = Math.max(0, 1 - easeOut3(p));
    dissolve.partAlpha  = Math.max(0, 1 - easeOut3(p));
    think.focusGlow = 1.0;   // маркер на сфере остаётся
    think.dotAlpha  = 0;     // travel-dot ещё не виден
    if (p >= 1.0) {
      dissolve.orbitAlpha = 0;
      dissolve.partAlpha  = 0;
      think.focusGlow     = 0;   // гасим маркер на сфере
      think.dotAlpha      = 1.0; // включаем travel-dot (в той же позиции)
      think.phase         = 'travel';
      think.phaseTime     = 0;
    }

  // ── TRAVEL ── одиночная точка летит в угол ────────────────────
  } else if (think.phase === 'travel') {
    const dur = 0.9;
    const p   = Math.min(1, pt / dur);
    const ep  = easeInOut(p);
    think.dotX = lerp(think.dotX, think.dotTargetX, ep * 0.12 + 0.01);
    think.dotY = lerp(think.dotY, think.dotTargetY, ep * 0.12 + 0.01);

    const dstX = Math.abs(think.dotX - think.dotTargetX);
    const dstY = Math.abs(think.dotY - think.dotTargetY);
    if (dstX < 4 && dstY < 4) {
      think.dotX         = think.dotTargetX;
      think.dotY         = think.dotTargetY;
      think.drawCX       = think.cornerX;
      think.drawCY       = think.cornerY;
      think.rebuildAlpha = 0.0;
      think.phase        = 'rebuild';
      think.phaseTime    = 0;
    }

  // ── REBUILD ── сфера собирается в углу из точки ───────────────
  } else if (think.phase === 'rebuild') {
    const dur = 1.0;
    const p   = Math.min(1, pt / dur);
    think.rebuildAlpha = easeOut3(p);
    think.dotAlpha     = 1.0 - easeOut3(p * 2);  // точка гаснет быстро
    if (think.dotAlpha < 0) think.dotAlpha = 0;
    // Восстанавливаем dissolve-alpha
    dissolve.orbitAlpha = think.rebuildAlpha;
    dissolve.partAlpha  = think.rebuildAlpha;
    if (p >= 1.0) {
      think.dotAlpha     = 0;
      think.rebuildAlpha = 1.0;
      dissolve.orbitAlpha = 1;
      dissolve.partAlpha  = 1;
      think.phase        = 'hold';
      think.phaseTime    = 0;
      // CSS-индикатор не используем — сфера в углу и так видна
    }

  // ── HOLD ── Гидеон в углу, ждёт exitThink() ──────────────────
  } else if (think.phase === 'hold') {
    // Лёгкое микро-движение точно как speakCorner.inCorner
    const cr = think.cornerR;
    think.drawCX = think.cornerX + Math.sin(pt * 1.05) * cr * 0.06;
    think.drawCY = think.cornerY + Math.sin(pt * 0.72 + 1.0) * cr * 0.05;

  // ── RETURN ── гасим всё в углу, возвращаем idle по центру ────
  } else if (think.phase === 'return') {
    const dur = 0.7;
    const p   = Math.min(1, pt / dur);
    // Гасим сферу в углу
    dissolve.orbitAlpha = Math.max(0, 1 - easeOut3(p));
    dissolve.partAlpha  = Math.max(0, 1 - easeOut3(p));
    think.rebuildAlpha  = 1 - p;
    if (p >= 1.0) {
      dissolve.orbitAlpha = 1.0;  // восстанавливаем для центральной сферы
      dissolve.partAlpha  = 1.0;
      think.phase        = 'idle';
      think.focusGlow    = 0.0;
      think.dotAlpha     = 0.0;
      think.rebuildAlpha = 0.0;
      think.drawCX       = CX;
      think.drawCY       = CY;
    }
  }
}

// Маркер выбранной точки (во время aim/pause/dissolveOut)
function drawFocusPoint(rY, rX) {
  if (think.focusGlow < 0.01) return;
  const { sx, sy } = project(think.targetNX, think.targetNY, think.targetNZ, rY, rX);
  const g = think.focusGlow;
  // Большое свечение
  const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 0.14);
  gr.addColorStop(0,   `rgba(80,180,255,${g * 0.90})`);
  gr.addColorStop(0.35,`rgba(60,140,240,${g * 0.55})`);
  gr.addColorStop(0.7, `rgba(40,110,210,${g * 0.20})`);
  gr.addColorStop(1,   'rgba(30,80,180,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(sx, sy, R * 0.14, 0, Math.PI * 2); ctx.fill();
  // Яркое ядро точки
  ctx.beginPath(); ctx.arc(sx, sy, R * 0.018, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(230,245,255,${g})`; ctx.fill();
}

// Одиночная точка — летит по экрану во время travel
function drawTravelDot() {
  if (think.dotAlpha < 0.01) return;
  const a = think.dotAlpha;
  const r = 5;
  const gr = ctx.createRadialGradient(think.dotX, think.dotY, 0, think.dotX, think.dotY, r * 5);
  gr.addColorStop(0,   `rgba(100,190,255,${a * 0.9})`);
  gr.addColorStop(0.4, `rgba(60,140,230,${a * 0.4})`);
  gr.addColorStop(1,   'rgba(40,100,200,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(think.dotX, think.dotY, r * 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(think.dotX, think.dotY, r, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(220,242,255,${a})`; ctx.fill();
}

// Центр рисования: think-угол (rebuild/hold/return) или speakCorner или центр
function getDC() {
  if (think.phase === 'rebuild' || think.phase === 'hold' || think.phase === 'return') {
    return { dcx: think.drawCX, dcy: think.drawCY };
  }
  if (isSpeakCornerActive()) {
    return { dcx: speakCorner.drawCX, dcy: speakCorner.drawCY };
  }
  return { dcx: CX, dcy: CY };
}

// Масштаб сферы в угловом режиме
function getSceneScale() {
  if (think.phase === 'rebuild' || think.phase === 'hold' || think.phase === 'return') {
    return think.cornerR / (Math.min(W, H) * 0.212);
  }
  if (isSpeakCornerActive()) return speakCorner.sceneScale;
  return 1.0;
}

// ═══════════════════════════════════════════════════════════════
//  ANIMATION TEST
//  Последовательность: aim → pause → zoom → hold → return → idle
// ═══════════════════════════════════════════════════════════════
function runAnimationTest() {
  document.querySelectorAll('#dev-controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-anim-test').classList.add('active');

  // Сбрасываем firstSpeak чтобы следующий speak ушёл в угол
  _firstSpeak = false;

  const prev = gState;
  gState = 'think';
  subEl.textContent = STATE_LABELS.think;
  enterThink();

  // aim(~2с) + pause(0.45с) + zoom(1.8с) ≈ 4.3с до hold
  // Держим hold 2 сек, потом возвращаем
  setTimeout(() => {
    exitThink();
    setTimeout(() => setState(prev === 'think' ? 'idle' : prev), 1800);
  }, 6500);
}


// ═══════════════════════════════════════════════════════════════
//  SPEAK: ПУЛЬС ЯРКОСТИ ЧАСТИЦ
// ═══════════════════════════════════════════════════════════════
function getSpeakPulse(t) {
  if (gState !== 'speak') return 0;
  const pa = cur.partAlpha;
  if (pa < 0.1) return 0;
  return pa * (Math.sin(t * Math.PI * 0.9) * 0.5 + 0.5);
}

// ═══════════════════════════════════════════════════════════════
//  LISTEN: РЕАКЦИЯ НА АМПЛИТУДУ ГОЛОСА
//
//  Внешний код (Python-бэкенд через WebSocket) может передавать
//  текущую громкость голоса в диапазоне [0..1]:
//    { "state": "listen", "amplitude": 0.45 }
//
//  Или вызывать напрямую:
//    setListenAmplitude(0.6);
//
//  Значение плавно interpolируется — без скачков.
//  Влияет ТОЛЬКО на яркость частиц (brightBoost в drawParticles).
//  Никакой геометрии, никаких волн, никакого хаоса.
// ═══════════════════════════════════════════════════════════════
let _listenAmpTarget = 0;   // цель [0..1], ставится извне
let _listenAmpCur    = 0;   // текущее сглаженное значение

// Публичный API — вызывать из WebSocket или напрямую
function setListenAmplitude(v) {
  _listenAmpTarget = Math.max(0, Math.min(1, v));
}

// Возвращает сглаженный множитель яркости [0..1] для listen
// Вызывается каждый кадр из render loop
function getListenAmp(dt) {
  if (gState !== 'listen') {
    _listenAmpTarget = 0;
    _listenAmpCur    = lerp(_listenAmpCur, 0, 0.12);
    return _listenAmpCur;
  }
  // Мягкое следование за амплитудой: нарастает быстро, спадает плавнее
  const speed = _listenAmpTarget > _listenAmpCur ? 0.18 : 0.08;
  _listenAmpCur = lerp(_listenAmpCur, _listenAmpTarget, speed);
  return _listenAmpCur * cur.partAlpha;
}


// ═══════════════════════════════════════════════════════════════
//  СИСТЕМА СНА
//  Если страница скрыта или нет активности >120 сек → sleep (1 fps)
// ═══════════════════════════════════════════════════════════════
let sleepMode    = false;
let lastActivity = performance.now();
let sleepTimer   = null;
const SLEEP_AFTER = 120_000;

function wakeUp() {
  lastActivity = performance.now();
  if (sleepMode) {
    sleepMode = false;
    if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
    requestAnimationFrame(draw);
  }
}
['mousemove','keydown','click','touchstart'].forEach(ev =>
  window.addEventListener(ev, wakeUp, { passive: true })
);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) sleepMode = true;
  else wakeUp();
});

// ═══════════════════════════════════════════════════════════════
//  3D PROJECTION
// ═══════════════════════════════════════════════════════════════
function project(nx, ny, nz, rY, rX) {
  const cosY = Math.cos(rY), sinY = Math.sin(rY);
  const x1   =  nx * cosY + nz * sinY;
  const z1   = -nx * sinY + nz * cosY;
  const cosX = Math.cos(rX), sinX = Math.sin(rX);
  const y2   =  ny * cosX - z1 * sinX;
  const z2   =  ny * sinX + z1 * cosX;
  const p    = 3.8 / (3.8 + z2 * 0.5);
  const { dcx, dcy } = getDC();
  return { sx: dcx + x1 * R * p, sy: dcy - y2 * R * p, z: z2, p };
}


// ═══════════════════════════════════════════════════════════════
//  WIREFRAME
// ═══════════════════════════════════════════════════════════════
const WIRE = { N_MERIDIANS: 18, N_PARALLELS: 14, CURVE_PTS: 120 };

function drawMeridian(lonDeg, rY, rX, alpha) {
  const lon = lonDeg * Math.PI / 180;
  ctx.beginPath();
  let first = true;
  for (let i = 0; i <= WIRE.CURVE_PTS; i++) {
    const lat = -Math.PI / 2 + Math.PI * (i / WIRE.CURVE_PTS);
    const { sx, sy } = project(
      Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon), rY, rX
    );
    if (first) { ctx.moveTo(sx, sy); first = false; } else ctx.lineTo(sx, sy);
  }
  ctx.strokeStyle = `rgba(45,95,165,${alpha})`; ctx.globalAlpha = 1;
  ctx.lineWidth = 1.1; ctx.stroke();
}

function drawParallel(latDeg, rY, rX, alpha) {
  const lat    = latDeg * Math.PI / 180;
  const cosLat = Math.cos(lat), sinLat = Math.sin(lat);
  const pts = [];
  for (let i = 0; i <= WIRE.CURVE_PTS; i++) {
    const lon = -Math.PI + Math.PI * 2 * (i / WIRE.CURVE_PTS);
    pts.push(project(cosLat * Math.sin(lon), sinLat, cosLat * Math.cos(lon), rY, rX));
  }
  ctx.beginPath();
  pts.forEach(({ sx, sy }, i) => { if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); });
  ctx.strokeStyle = `rgba(45,95,165,${alpha})`; ctx.lineWidth = 1.1; ctx.stroke();

  for (let m = 0; m < WIRE.N_MERIDIANS; m++) {
    const lon  = (m / WIRE.N_MERIDIANS) * Math.PI * 2 - Math.PI;
    const { sx, sy, z, p } = project(cosLat * Math.sin(lon), sinLat, cosLat * Math.cos(lon), rY, rX);
    const vis  = Math.max(0.1, Math.min(1, (z + 1.3) / 1.4));
    const dotR = R * 0.021 * p * (0.7 + 0.3 * vis);
    const gr   = ctx.createRadialGradient(sx - dotR*0.3, sy - dotR*0.3, dotR*0.05, sx, sy, dotR);
    gr.addColorStop(0,   `rgba(220,240,255,${vis*alpha*1.2})`);
    gr.addColorStop(0.5, `rgba(100,170,230,${vis*alpha*0.9})`);
    gr.addColorStop(1,   `rgba(50,110,200,${vis*alpha*0.5})`);
    ctx.fillStyle = gr; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(sx, sy, dotR, 0, Math.PI*2); ctx.fill();
  }
}

function drawWireframe(rY, rX) {
  const a = cur.wireAlpha * (0.5 + 0.5 * cur.energy);
  if (a < 0.01) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let m = 0; m < WIRE.N_MERIDIANS; m++)
    drawMeridian((m / WIRE.N_MERIDIANS) * 360 - 180, rY, rX, a * 0.78);
  for (let p = 0; p <= WIRE.N_PARALLELS; p++) {
    const latDeg = -90 + 180 * (p / WIRE.N_PARALLELS);
    if (Math.abs(latDeg) > 82) continue;
    drawParallel(latDeg, rY, rX, a * 0.78);
  }
  ctx.restore();
}


// ═══════════════════════════════════════════════════════════════
//  PARTICLE SPHERE
// ═══════════════════════════════════════════════════════════════
const PART = { COLS: 48, PTS_COL: 36 };
let particles = [];

function buildParticles() {
  particles = [];
  for (let c = 0; c < PART.COLS; c++) {
    const lon = (c / PART.COLS) * Math.PI * 2;
    for (let r = 0; r < PART.PTS_COL; r++) {
      const lat = -Math.PI / 2 + Math.PI * ((r + 0.5) / PART.PTS_COL);
      particles.push({
        nx: Math.cos(lat) * Math.sin(lon), ny: Math.sin(lat), nz: Math.cos(lat) * Math.cos(lon),
        col: c, row: r,
        phase:  Math.random() * Math.PI * 2,
        speed:  0.6 + Math.random() * 1.4,
        size:   0.012 + Math.random() * 0.010,
        bright: 0.5 + Math.random() * 0.5,
      });
    }
  }
}

// brightMult [0..1] — суммарный буст яркости (speak pulse ИЛИ listen amplitude)
function drawParticles(rY, rX, t, brightMult) {
  const pa = cur.partAlpha;
  if (pa < 0.01) return;

  const cosRY = Math.cos(rY), sinRY = Math.sin(rY);
  const cosRX = Math.cos(rX), sinRX = Math.sin(rX);
  const PI2   = Math.PI * 2;
  const { dcx, dcy } = getDC();

  const projected = particles.map(p => {
    const x1 =  p.nx * cosRY + p.nz * sinRY;
    const z1 = -p.nx * sinRY + p.nz * cosRY;
    const y2 =  p.ny * cosRX - z1 * sinRX;
    const z2 =  p.ny * sinRX + z1 * cosRX;

    const wavePhase = p.ny * 3.0 + t * cur.siriFreq + p.phase * 0.2;
    const rr = 1.0 + Math.sin(wavePhase) * cur.siriAmp;

    const sx    = dcx + x1 * R * rr;
    const sy    = dcy - y2 * R * rr;
    const depth = (z2 + 1) / 2;
    const bright= depth * p.bright * (0.55 + 0.45 * Math.sin(t * p.speed + p.phase));
    const edgeF = Math.sqrt(Math.max(0, 1 - p.ny * p.ny));
    const dotR  = R * p.size * (0.4 + 0.6 * depth) * (0.5 + 0.5 * edgeF);

    return { sx, sy, z2, depth, bright, dotR };
  });

  projected.sort((a, b) => a.z2 - b.z2);
  const brightBoost = 1.0 + brightMult * 0.45;

  projected.forEach(({ sx, sy, depth, bright, dotR }) => {
    if (bright < 0.04) return;
    const rim    = 1.0 + (1 - depth) * 1.1;
    const finalB = Math.min(1, bright * rim * (0.6 + 0.4 * cur.energy) * brightBoost) * pa;
    const gr = ctx.createRadialGradient(sx - dotR*0.2, sy - dotR*0.2, 0, sx, sy, dotR * 2.5);
    gr.addColorStop(0,   `rgba(60,130,230,${finalB * 0.55})`);
    gr.addColorStop(0.4, `rgba(40,100,200,${finalB * 0.22})`);
    gr.addColorStop(1,   'rgba(20,70,170,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(sx, sy, dotR * 2.5, 0, PI2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx, sy, dotR, 0, PI2);
    ctx.fillStyle = `rgba(50,120,220,${finalB})`; ctx.fill();
  });

  // Лёгкий ободок
  const rim1 = ctx.createRadialGradient(dcx, dcy, R * 0.82, dcx, dcy, R * 1.00);
  rim1.addColorStop(0,   'rgba(80,140,220,0)');
  rim1.addColorStop(0.8, `rgba(60,120,200,${0.06 * cur.energy * pa})`);
  rim1.addColorStop(1,   'rgba(40,100,180,0)');
  ctx.fillStyle = rim1;
  ctx.beginPath(); ctx.arc(dcx, dcy, R * 1.00, 0, PI2); ctx.fill();
}


// ═══════════════════════════════════════════════════════════════
//  ORBITS
// ═══════════════════════════════════════════════════════════════
const ORBITS = [
  { tiltX: 0.52, tiltZ: 0.30, rotSpd: 0.60, ph: 0.00, rm: 1.55, lw: 1.6, a: 0.55 },
  { tiltX:-0.42, tiltZ: 0.68, rotSpd:-0.48, ph: 1.05, rm: 1.63, lw: 1.4, a: 0.50 },
  { tiltX: 1.08, tiltZ:-0.28, rotSpd: 0.40, ph: 2.10, rm: 1.72, lw: 1.2, a: 0.44 },
  { tiltX:-0.78, tiltZ:-0.52, rotSpd:-0.34, ph: 3.14, rm: 1.82, lw: 1.1, a: 0.38 },
  { tiltX: 0.30, tiltZ: 0.22, rotSpd: 0.52, ph: 0.70, rm: 1.94, lw: 1.0, a: 0.30 },
];

function drawOrbit(o, t, alphaMultiplier) {
  if (alphaMultiplier < 0.005) return;
  const rotAngle = t * o.rotSpd * cur.spd + o.ph;
  const orbitR   = R * o.rm;
  const N        = 160;
  const cTx = Math.cos(o.tiltX), sTx = Math.sin(o.tiltX);
  const cTz = Math.cos(o.tiltZ), sTz = Math.sin(o.tiltZ);
  const cR  = Math.cos(rotAngle), sR  = Math.sin(rotAngle);
  const { dcx, dcy } = getDC();

  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const theta = (i / N) * Math.PI * 2;
    let x = Math.cos(theta) * orbitR, y = Math.sin(theta) * orbitR, z = 0;
    const yr1 = y*cTx - z*sTx, zr1 = y*sTx + z*cTx; y = yr1; z = zr1;
    const xr1 = x*cTz - y*sTz, yr2  = x*sTz + y*cTz; x = xr1; y = yr2;
    const xr2 = x*cR  + z*sR,  zr2  =-x*sR  + z*cR;  x = xr2; z = zr2;
    const persp = 1 / (1 + z * 0.00018);
    if (i === 0) ctx.moveTo(dcx + x*persp, dcy + y*persp*0.90);
    else          ctx.lineTo(dcx + x*persp, dcy + y*persp*0.90);
  }
  const alpha = o.a * Math.min(1, cur.energy * 1.2 + 0.45) * alphaMultiplier;
  ctx.strokeStyle = `rgba(50,100,190,${alpha * 0.16})`; ctx.lineWidth = o.lw * 7; ctx.stroke();
  ctx.strokeStyle = `rgba(55,105,195,${alpha * 0.82})`; ctx.lineWidth = o.lw;     ctx.stroke();
}

function drawOrbits(t, far, alphaMultiplier = 1.0) {
  ORBITS.filter(o => far ? o.rm > 1.6 : o.rm <= 1.6).forEach(o => drawOrbit(o, t, alphaMultiplier));
}

//  PULSE RINGS (только listen)
// ═══════════════════════════════════════════════════════════════
//  PULSE RINGS — убраны полностью (п.1)
//  Функция оставлена как заглушка — вызов из draw не трогаем
// ═══════════════════════════════════════════════════════════════
function drawPulseRings(_t) { /* кольца не пульсируют */ }


// ═══════════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════════
const startT = performance.now();
let lastT    = 0;

function draw() {
  const nowMs = performance.now();

  if (!sleepMode && nowMs - lastActivity > SLEEP_AFTER) sleepMode = true;
  if (sleepMode) {
    sleepTimer = setTimeout(() => { sleepTimer = null; requestAnimationFrame(draw); }, 1000);
    return;
  }

  requestAnimationFrame(draw);

  const now = (nowMs - startT) / 1000;
  const dt  = Math.min(now - lastT, 0.05);
  lastT     = now;
  const t   = now;

  lerpState();
  updateThink(dt);
  updateSpeakCorner(dt);
  updateDissolve(dt);   // ← распад / сборка

  // Яркость частиц: speak-пульс ИЛИ listen-амплитуда (берём максимум)
  const speakPulse = getSpeakPulse(t);
  const listenAmp  = getListenAmp(dt);
  const brightMult = Math.max(speakPulse, listenAmp);

  // Мышь управляет вращением только в aim/pause
  const thinkOwnsRot = think.phase === 'aim' || think.phase === 'pause';
  if (!thinkOwnsRot) {
    rotY += (mx * 0.33 - rotY) * 0.04;
    rotX += (my * 0.17 - rotX) * 0.04;
  }

  const rY = rotY + t * cur.spd * 0.32;
  const rX = rotX + Math.sin(t * 0.55) * 0.038;

  // ── Масштаб сферы ─────────────────────────────────────────────
  // В угловых режимах (think-hold, speakCorner) — уменьшена
  const savedR = R;
  const scl = getSceneScale();
  if (Math.abs(scl - 1.0) > 0.0005) R = savedR * scl; // eslint-disable-line

  ctx.clearRect(0, 0, W, H);

  // ── dissolve: временно масштабируем alpha-параметры ──────────
  // Для колец — передаём orbitAlpha в drawOrbit через closure-переменную
  // Для частиц — временно корректируем cur.partAlpha
  const dOA = dissolve.orbitAlpha;   // множитель колец   [0..1]
  const dPA = dissolve.partAlpha;    // множитель частиц  [0..1]
  const dWA = dissolve.wireAlpha;    // множитель wireframe при summon [0..1]

  // При summon (phase==='in') wireframe управляется dissolve, а не STATE_PARAMS
  const savedWireAlpha = cur.wireAlpha;
  if (dissolve.phase === 'in') cur.wireAlpha = dWA;

  // Временно масштабируем partAlpha для частиц
  const savedPartAlpha = cur.partAlpha;
  cur.partAlpha = cur.partAlpha * dPA;

  drawOrbits(t, true,  dOA);

  const { dcx, dcy } = getDC();
  const glowBoost = 1.0 + think.focusGlow * 0.5;
  const glowR     = R * 1.12;
  const glow      = ctx.createRadialGradient(dcx, dcy, R * 0.5, dcx, dcy, glowR * 1.4);
  glow.addColorStop(0,   `rgba(80,140,230,${0.11 * cur.energy * glowBoost})`);
  glow.addColorStop(0.5, `rgba(60,110,200,${0.04 * cur.energy * glowBoost})`);
  glow.addColorStop(1,   'rgba(40,80,180,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(dcx, dcy, glowR * 1.4, 0, Math.PI * 2); ctx.fill();

  drawWireframe(rY, rX);
  drawParticles(rY, rX, t, brightMult);
  drawFocusPoint(rY, rX);
  drawTravelDot();         // летящая точка (think: travel)
  drawOrbits(t, false, dOA);
  drawPulseRings(t);

  // Восстанавливаем сохранённые значения
  cur.partAlpha  = savedPartAlpha;
  cur.wireAlpha  = savedWireAlpha;

  R = savedR; // eslint-disable-line
}

// ── СТАРТ ──
resize();
speakCorner.drawCX = CX;
speakCorner.drawCY = CY;
requestAnimationFrame(draw);
</script>
</body>
</html>
